services:
  web:
    image: node:24-alpine
    working_dir: /app
    init: true
    command: >
      sh -c "npm ci &&
      npm run dev -- --host 0.0.0.0"
    ports:
      - "${SITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  node_modules:
